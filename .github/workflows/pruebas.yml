name: pruebas
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compilar scripts
        run: python -m py_compile scripts/*.py scripts/revisar/*.py
      - name: Pruebas (sin red ni navegador)
        run: python -m unittest discover -s tests -v
